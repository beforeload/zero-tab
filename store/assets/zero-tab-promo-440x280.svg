<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <defs>
    <linearGradient id="promo-bg" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="1" stop-color="#DAE7FA"/>
    </linearGradient>
    <linearGradient id="promo-icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4AA8FF"/>
      <stop offset="1" stop-color="#0A66E8"/>
    </linearGradient>
    <filter id="promo-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0A4FBE" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="440" height="280" fill="url(#promo-bg)"/>

  <!-- Same artwork as extension/icons/icon.svg, scaled to an 88px tile. -->
  <g filter="url(#promo-shadow)" transform="translate(44 96) scale(0.6875)">
    <rect width="128" height="128" rx="29" fill="url(#promo-icon)"/>
    <rect x="27" y="25" width="42" height="15" rx="7.5" fill="#FFFFFF" opacity="0.5"/>
    <rect x="27" y="46" width="74" height="57" rx="14" fill="#FFFFFF"/>
    <path d="M47 61h34L47 88h34" fill="none" stroke="#0A66E8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="160" y="127" fill="#101418" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1.2">Zero Tab</text>
  <text x="161" y="155" fill="#4C5560" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500">Your tabs, under control.</text>
  <text x="161" y="182" fill="#0A66E8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.2">Local-first · No account · No tracking</text>
</svg>
