<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zero Tab marquee promo tile</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 1400px;
      height: 560px;
      margin: 0;
      overflow: hidden;
    }

    body {
      position: relative;
      color: #26231f;
      background: #f4f1e9;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(247, 244, 236, 0.98) 0%, rgba(247, 244, 236, 0.9) 32%, rgba(247, 244, 236, 0.08) 66%);
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      width: 610px;
      height: 100%;
      align-items: flex-start;
      justify-content: center;
      flex-direction: column;
      padding-left: 92px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      color: #6f6a61;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand img {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 8px 18px rgba(74, 58, 45, 0.14));
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 78px;
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.95;
    }

    .tagline {
      max-width: 500px;
      margin: 24px 0 0;
      color: #5c564e;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      line-height: 1.28;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 32px;
    }

    .features span {
      padding: 9px 13px;
      border: 1px solid rgba(116, 93, 75, 0.18);
      border-radius: 999px;
      color: #625c53;
      background: rgba(255, 253, 248, 0.72);
      box-shadow: 0 4px 14px rgba(69, 53, 42, 0.05);
      font-size: 12px;
      font-weight: 650;
    }

    .accent {
      position: absolute;
      z-index: 2;
      bottom: 46px;
      left: 92px;
      width: 58px;
      height: 3px;
      border-radius: 99px;
      background: #d97757;
    }
  </style>
</head>
<body>
  <img class="background" src="zero-tab-marquee-background.png" alt="">
  <div class="veil"></div>
  <main class="content">
    <div class="brand">
      <img src="../../extension/icons/icon.svg" alt="">
      Local-first Chrome extension
    </div>
    <h1>Zero Tab</h1>
    <p class="tagline">Your tabs, finally working as one personal workstation.</p>
    <div class="features">
      <span>Group tabs by domain</span>
      <span>Save for later</span>
      <span>AI Builder brief</span>
    </div>
  </main>
  <div class="accent"></div>
</body>
</html>
